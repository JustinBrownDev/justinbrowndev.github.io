<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>jweb.dev</title>
    <meta name="description" content="A cramped neon back-alley maze, walkable in 3D.">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
#hint {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #e8c9c9cc;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            z-index: 25;
            pointer-events: none;
            text-shadow: 0 0 6px #000, 0 0 2px #000;
            transition: opacity 0.4s;
        }

        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffffffaa;
            z-index: 15;
            display: none;
            pointer-events: none;
        }

        /* touch controls */
        #joystickZone, #lookZone {
            position: fixed;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 10;
            touch-action: none;
            display: none;
        }
        #joystickZone { left: 0; }
        #lookZone { right: 0; }

        #joystickBase {
            position: fixed;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid #ff2f6a66;
            background: #ff2f6a11;
            display: none;
            z-index: 11;
            pointer-events: none;
        }
        #joystickKnob {
            position: fixed;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #ff2f6a55;
            border: 1px solid #ff2f6a;
            display: none;
            z-index: 12;
            pointer-events: none;
        }

        /* boot diagnostics -- visible from the very first paint, before
           main.js has even started fetching, so "the page is just blank"
           is never the whole story again. Fades out on a real ready()
           call; stays put (and turns red) on fail() so an error is
           something to screenshot, not something invisible in devtools. */
        #bootStatus {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #0a0305;
            color: #e8c9c9;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.5s;
        }
        #bootStatusLine {
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            margin-bottom: 14px;
            text-align: center;
        }
        #bootStatusLog {
            font-size: 0.68rem;
            line-height: 1.5;
            color: #a89090;
            max-width: 640px;
            max-height: 40vh;
            overflow-y: auto;
            text-align: left;
        }
        #bootStatus.bootDone {
            opacity: 0;
            pointer-events: none;
        }
        #bootStatus.bootFailed {
            background: #1a0505;
        }
        #bootStatus.bootFailed #bootStatusLine {
            color: #ff5f5f;
        }
    </style>

    <style id="testProgressiveBootStyle">
        /* Client-facing progressive console: large, fast and truthful. */
        #bootStatus {
            inset: 14px auto auto 14px;
            width: min(940px, calc(100vw - 28px));
            max-height: 62vh;
            display: block;
            padding: 14px 16px;
            background: #000000dc;
            border: 1px solid #d9999966;
            backdrop-filter: blur(3px);
            pointer-events: auto;
            overflow: hidden;
        }
        #bootStatusLine { margin: 0 0 8px; font-size: 1rem; }
        #bootStatusMetrics { color: #d7bbbb; font-size: .78rem; margin-bottom: 7px; }
        #bootStatusLog { max-height: 48vh; font-size: .72rem; line-height: 1.25; overflow: hidden; }
        #bootStatus.bootDone { opacity: 0; }
        #bootActions {
            position: fixed;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            padding: 15px 18px;
            background: #000000e8;
            border: 1px solid #e8c9c977;
            color: #e8c9c9;
            text-align: center;
            transition: opacity .25s;
        }
        #bootActions a { color: #fff; font-size: 1rem; font-weight: bold; }
        #bootActions small { max-width: 420px; color: #bba2a2; }
        body.cityEntered #bootStatus, body.cityEntered #bootActions,
        body.bootComplete #bootActions { opacity: 0; pointer-events: none; }
        @media (max-width: 700px) {
            #bootStatus { max-height: 54vh; }
            #bootStatusLog { max-height: 39vh; font-size: .66rem; }
        }
    </style>
</head>

<body>
<div id="crosshair"></div>
    <div id="hint"></div>
    <div id="joystickZone"></div>
    <div id="lookZone"></div>
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>

    <div id="bootStatus">
        <div id="bootStatusLine">booting…</div>
        <div id="bootStatusMetrics">LOG 0 lines/s · WORK waiting</div>
        <div id="bootStatusLog"></div>
    </div>
    <div id="bootActions">
        <a id="oldHomepageEscape" href="./old/">BACK TO OLD HOMEPAGE</a>
        <small>Low-memory escape. Loading stops immediately. Click the city outside this panel only when you want mouse-look and WASD control.</small>
    </div>

    <script>
        // Plain classic script, runs immediately (before the module script
        // below even starts fetching) -- this is diagnostic scaffolding so
        // "the page is just blank" turns into "here's exactly which phase
        // it got stuck on, or the exact error," instead of nothing at all.
        // window.__boot is the API main.js calls into as it progresses.
        (function () {
            const line = document.getElementById('bootStatusLine');
            const metrics = document.getElementById('bootStatusMetrics');
            const log = document.getElementById('bootStatusLog');
            const t0 = performance.now();
            const rows = [];
            let phase = 'document bootstrap';
            let done = 0, total = 0, workRate = 0, lastDone = 0, lastWorkAt = t0;
            let linesThisSecond = 0, lineRate = 0, totalLines = 0, lastRateAt = t0;
            let resourceSummary = '0 resources';
            const requestedNumericParams = [...new URLSearchParams(location.search).entries()].filter(([key]) =>
                key === 'seed' || key === 'citySize' || key.startsWith('n.') || key.startsWith('cfg.'));
            function stamp() { return ((performance.now() - t0) / 1000).toFixed(2) + 's'; }
            function push(text, isError) {
                const row = document.createElement('div');
                row.textContent = `[${stamp()}] ${text}`;
                if (isError) row.style.color = '#ff5f5f';
                log.appendChild(row);
                rows.push(text);
                linesThisSecond++; totalLines++;
                while (log.childNodes.length > 180) log.removeChild(log.firstChild);
                log.scrollTop = log.scrollHeight;
            }
            const telemetryTimer = setInterval(() => {
                const now = performance.now();
                if (now - lastRateAt >= 1000) {
                    lineRate = linesThisSecond * 1000 / (now - lastRateAt);
                    linesThisSecond = 0; lastRateAt = now;
                }
                if (totalLines % 10 === 0) {
                    const resources = performance.getEntriesByType('resource');
                    const bytes = resources.reduce((sum, r) => sum + (r.transferSize || 0), 0);
                    resourceSummary = `${resources.length} resources · ${(bytes / 1048576).toFixed(1)} MB transferred`;
                }
                const progress = total > 0 ? `${done}/${total}` : 'measuring';
                const heap = performance.memory ? ` · heap ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} MB` : '';
                metrics.textContent = `LOG ${lineRate.toFixed(1)} lines/s · ${totalLines} lines · WORK ${workRate.toFixed(1)} units/s · ${progress}`;
                push(`${phase} · ${progress} · ${workRate.toFixed(1)} units/s · ${resourceSummary}${heap}`);
            }, 50);
            window.__boot = {
                elapsed() { return (performance.now() - t0) / 1000; }, // seconds since THIS script ran -- before main.js has even started fetching, so this covers the corpus download+parse time main.js's own clock can't see
                status(text) { line.textContent = text; push(text); console.log('[boot]', stamp(), text); },
                progress(nextPhase, nextDone = done, nextTotal = total) {
                    phase = nextPhase || phase;
                    done = Number(nextDone) || 0; total = Number(nextTotal) || 0;
                    const now = performance.now(), seconds = Math.max(.001, (now - lastWorkAt) / 1000);
                    workRate = Math.max(0, done - lastDone) / seconds;
                    lastDone = done; lastWorkAt = now;
                },
                enter() { document.body.classList.add('cityEntered'); this.cityRequested = true; },
                ready() {
                    line.textContent = 'ready';
                    document.getElementById('bootStatus').classList.add('bootDone');
                    document.body.classList.add('bootComplete');
                    clearInterval(telemetryTimer);
                    console.log('[boot]', stamp(), 'ready -- overlay fading');
                },
                fail(text) {
                    line.textContent = 'FAILED: ' + text;
                    document.getElementById('bootStatus').classList.add('bootFailed');
                    push(text, true);
                },
            };
            document.getElementById('oldHomepageEscape').addEventListener('click', (event) => {
                event.preventDefault();
                clearInterval(telemetryTimer);
                line.textContent = 'stopping city and releasing resources…';
                try { window.__shutdownCity?.(); } catch (error) { console.warn('[shutdown]', error); }
                location.replace('./old/');
            });
            window.addEventListener('error', (e) => {
                window.__boot.fail((e.error && e.error.stack) ? e.error.stack : e.message + ' (' + e.filename + ':' + e.lineno + ')');
            });
            window.addEventListener('unhandledrejection', (e) => {
                window.__boot.fail('unhandled promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
            });
            if (requestedNumericParams.length) {
                const preview = requestedNumericParams.slice(0, 6).map(([k, v]) => `${k}=${v}`).join(' · ');
                push(`PARAMETERIZED LOAD: ${requestedNumericParams.length} numeric/query value${requestedNumericParams.length === 1 ? '' : 's'} requested${preview ? ' · ' + preview : ''}`);
            }
            window.__boot.status('fetching three.js + noise corpus (large files, first load only -- this can take a while on a slow connection)…' + (requestedNumericParams.length ? ` · ${requestedNumericParams.length} parameter value(s) in URL` : ''));
        })();
    </script>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js"
        }
    }
    </script>
    <script type="module" src="./test/main.js" onerror="window.__boot?.fail('main.js failed to load as a module -- check the network tab for a 404/CORS/MIME-type error on main.js or one of its imports')"></script>
</body>

</html>
