<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jweb.dev</title>
    <meta name="description" content="A cramped neon back-alley maze, walkable in 3D.">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0305;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
#hint {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #e8c9c9cc;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            z-index: 25;
            pointer-events: none;
            text-shadow: 0 0 6px #000, 0 0 2px #000;
            transition: opacity 0.4s;
        }

        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffffffaa;
            z-index: 15;
            display: none;
            pointer-events: none;
        }

        /* touch controls */
        #joystickZone, #lookZone {
            position: fixed;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 10;
            touch-action: none;
            display: none;
        }
        #joystickZone { left: 0; }
        #lookZone { right: 0; }

        #joystickBase {
            position: fixed;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid #ff2f6a66;
            background: #ff2f6a11;
            display: none;
            z-index: 11;
            pointer-events: none;
        }
        #joystickKnob {
            position: fixed;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #ff2f6a55;
            border: 1px solid #ff2f6a;
            display: none;
            z-index: 12;
            pointer-events: none;
        }

        /* Unified startup console. The page starts rendering immediately; this is
           telemetry, not a blocking splash screen. */
        #bootStatus {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
            gap: 18px;
            align-items: center;
            padding: clamp(14px, 3vw, 36px);
            background: radial-gradient(circle at 40% 45%, #18090d 0%, #0a0305 58%, #050203 100%);
            color: #e8c9c9;
            font-family: 'Courier New', monospace;
            transition: opacity .45s ease;
            pointer-events: none;
        }
        #bootTerminal {
            min-width: 0;
            height: min(72vh, 680px);
            border: 1px solid #d9999950;
            background: #060203d9;
            box-shadow: inset 0 0 70px #3b0c1720;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #bootStatusLine {
            flex: 0 0 auto;
            font-size: .78rem;
            line-height: 1.35;
            letter-spacing: .07em;
            text-transform: uppercase;
            padding-bottom: 9px;
            margin-bottom: 8px;
            border-bottom: 1px solid #d9999930;
            color: #ffd9df;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #bootStreamFilters {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 8px;
            pointer-events: auto;
        }
        #bootStreamFilters button {
            min-height: 28px;
            border: 1px solid #d9999938;
            background: #0b0406;
            color: #9f858a;
            font: inherit;
            font-size: .58rem;
            letter-spacing: .055em;
            text-transform: uppercase;
            padding: 4px 8px;
            cursor: pointer;
        }
        #bootStreamFilters button[aria-pressed="true"],
        #bootStreamFilters button:hover,
        #bootStreamFilters button:focus-visible {
            color: #ffe1e6;
            border-color: #d9999980;
            outline: none;
        }
        #bootStatusLog {
            min-height: 0;
            flex: 1 1 auto;
            overflow: hidden;
            font-size: clamp(.58rem, 1vw, .72rem);
            line-height: 1.28;
            color: #bca1a6;
            text-align: left;
            white-space: nowrap;
        }
        #bootStatusLog > div { overflow: hidden; text-overflow: clip; }
        #bootChoice {
            pointer-events: auto;
            border: 1px solid #d9999950;
            background: #0a0305e8;
            padding: 20px;
            align-self: center;
        }
        #bootChoice h1 {
            margin: 0 0 12px;
            font: inherit;
            font-size: 1.3rem;
            color: #ffe9ec;
            letter-spacing: .04em;
        }
        #bootChoice p {
            margin: 0 0 16px;
            color: #c8aeb3;
            font-size: .82rem;
            line-height: 1.55;
        }
        #bootChoiceActions { display: grid; gap: 9px; }
        #escapeSiteButton {
            min-height: 44px;
            border: 1px solid #d9999960;
            background: #16070a;
            color: #f4dfe3;
            font: inherit;
            font-size: .78rem;
            text-align: left;
            padding: 10px 12px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        #escapeSiteButton:hover,
        #escapeSiteButton:focus-visible {
            border-color: #ffd0d8;
            background: #251015;
            outline: none;
        }
        #escapeSiteButton.runtimeEscape {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 45;
            min-height: 36px;
            width: auto;
            max-width: min(320px, calc(100vw - 24px));
            padding: 8px 10px;
            background: #080305d9;
            border-color: #d9999948;
            color: #e8c9c9d9;
            font-size: .66rem;
            letter-spacing: .035em;
            opacity: .78;
        }
        #escapeSiteButton.runtimeEscape:hover,
        #escapeSiteButton.runtimeEscape:focus-visible { opacity: 1; }
        #bootStatus.bootDone { opacity: 0; pointer-events: none; }
        #bootStatus.bootFailed { background: #1a0505; pointer-events: auto; }
        #bootStatus.bootFailed #bootStatusLine { color: #ff5f5f; }
        @media (max-width: 760px) {
            #bootStatus { grid-template-columns: 1fr; align-content: center; }
            #bootTerminal { height: 48vh; }
            #bootChoice { width: 100%; }
        }
    </style>

    
</head>

<body>
<div id="crosshair"></div>
    <div id="hint"></div>
    <div id="joystickZone"></div>
    <div id="lookZone"></div>
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>

    <div id="bootStatus">
        <div id="bootTerminal" aria-live="polite">
            <div id="bootStatusLine">world stream / initializing</div>
            <div id="bootStreamFilters" aria-label="Terminal stream filter">
                <button type="button" data-stream="all" aria-pressed="true">all</button>
                <button type="button" data-stream="world" aria-pressed="false">world</button>
                <button type="button" data-stream="render" aria-pressed="false">render</button>
                <button type="button" data-stream="physics" aria-pressed="false">physics</button>
                <button type="button" data-stream="data" aria-pressed="false">data</button>
            </div>
            <div id="bootStatusLog"></div>
        </div>
        <aside id="bootChoice" aria-label="Site escape option">
            <h1>Hello.</h1>
            <p>The interactive world is building its first complete chunk now. Watch the stream, or leave for the regular website at any time.</p>
            <div id="bootChoiceActions">
                <a id="escapeSiteButton" href="./old/">Escape to regular website</a>
            </div>
        </aside>
    </div>

    <script>
        // Plain classic script, runs immediately (before the module script
        // below even starts fetching) -- this is diagnostic scaffolding so
        // "the page is just blank" turns into "here's exactly which phase
        // it got stuck on, or the exact error," instead of nothing at all.
        // window.__boot is the API main.js calls into as it progresses.
        (function () {
            const line = document.getElementById('bootStatusLine');
            const log = document.getElementById('bootStatusLog');
            const filterButtons = [...document.querySelectorAll('#bootStreamFilters [data-stream]')];
            const t0 = performance.now();
            const rows = [];
            let activeStream = 'all';
            const telemetry = [
                'WORLD FORMAT  v1 stable identity', 'WORLD SINGULARS  map near origin',
                'SPAWN CHUNK  priority=absolute', 'CHUNK 0,0  topology contract',
                'AUTHORITY  state != renderer', 'ENTITY IDS  coordinate stable',
                'PHYSICS  broadphase append',
                'RENDER  chunk-local batching', 'MATERIALS  dedupe local',
                'MESHES  freeze after commit', 'FRONTIER  unavailable until READY',
                'RNG  coordinate-addressed', 'WORLD  distance weirdness scalar',
                'LANDMARKS  origin neighborhood', 'FUTURE AREA  reserved singular slot',
                'NOISE  bootstrap corpus', 'NOISE  full corpus deferred',
                'SCHEDULER  nearest unfinished first', 'CLIENT  input never owns generation',
                'CHUNK  build off-scene / commit atomically', 'CHUNK  optimize before ready',
                'WORLD  unload beyond retention', 'REVISIT  regenerate exact contract',
                'GC  dispose geometry/material references', 'ORIGIN  rebasing seam reserved',
                'STREETS  boundary contract', 'BUILDINGS  deterministic parcel seed',
                'INTERIORS  chunk-owned', 'LINK JOBS  wait for both neighbors',
                'SPACE  jump', 'F  freecam', 'P  parameters', 'POINTER  lock ready'
            ];
            let telemetryIndex = 0;
            let telemetryTimer = 0;
            const requestedNumericParams = [...new URLSearchParams(location.search).entries()].filter(([key]) =>
                key === 'seed' || key === 'citySize' || key.startsWith('n.') || key.startsWith('cfg.'));
            function stamp() { return ((performance.now() - t0) / 1000).toFixed(2) + 's'; }
            function streamFor(text) {
                if (/PHYSICS|COLLISION|FRONTIER|STAIR|RAMP|SPACE/i.test(text)) return 'physics';
                if (/RENDER|MATERIAL|MESH|LIGHT|OPTIMIZ|PAINT|GLTF|DECOR/i.test(text)) return 'render';
                if (/NOISE|RNG|FORMAT|ENTITY|SINGULAR|PARAMETER|CORPUS|DATA/i.test(text)) return 'data';
                return 'world';
            }
            function applyStreamFilter() {
                for (const row of log.children) row.hidden = activeStream !== 'all' && row.dataset.stream !== activeStream;
            }
            for (const button of filterButtons) {
                button.addEventListener('click', () => {
                    activeStream = button.dataset.stream || 'all';
                    for (const peer of filterButtons) peer.setAttribute('aria-pressed', String(peer === button));
                    applyStreamFilter();
                });
            }
            function push(text, isError) {
                const row = document.createElement('div');
                row.dataset.stream = streamFor(text);
                row.textContent = `[${stamp()}] ${text}`;
                row.hidden = activeStream !== 'all' && row.dataset.stream !== activeStream;
                if (isError) row.style.color = '#ff5f5f';
                log.appendChild(row);
                rows.push(text);
                while (log.childNodes.length > 72) log.removeChild(log.firstChild);
            }
            function startTelemetry() {
                if (telemetryTimer) return;
                telemetryTimer = setInterval(() => {
                    const base = telemetry[telemetryIndex++ % telemetry.length];
                    const n = (Math.imul(telemetryIndex + 17, 2654435761) >>> 0).toString(16).padStart(8, '0');
                    push(`${base}  :: ${n}`);
                }, 14);
            }
            function stopTelemetry() {
                if (!telemetryTimer) return;
                clearInterval(telemetryTimer);
                telemetryTimer = 0;
            }
            startTelemetry();
            window.__boot = {
                elapsed() { return (performance.now() - t0) / 1000; }, // seconds since THIS script ran -- before main.js has even started fetching, so this covers the corpus download+parse time main.js's own clock can't see
                status(text) { line.textContent = text; push(text); console.log('[boot]', stamp(), text); },
                ready() {
                    stopTelemetry();
                    line.textContent = 'ready · world stream continues around player';
                    const escape = document.getElementById('escapeSiteButton');
                    if (escape) {
                        document.body.appendChild(escape);
                        escape.classList.add('runtimeEscape');
                    }
                    document.getElementById('bootStatus').classList.add('bootDone');
                    console.log('[boot]', stamp(), 'ready -- overlay fading; background chunk stream remains active');
                },
                fail(text) {
                    stopTelemetry();
                    line.textContent = 'FAILED: ' + text;
                    document.getElementById('bootStatus').classList.add('bootFailed');
                    push(text, true);
                },
            };
            window.addEventListener('error', (e) => {
                window.__boot.fail((e.error && e.error.stack) ? e.error.stack : e.message + ' (' + e.filename + ':' + e.lineno + ')');
            });
            window.addEventListener('unhandledrejection', (e) => {
                window.__boot.fail('unhandled promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
            });
            if (requestedNumericParams.length) {
                const preview = requestedNumericParams.slice(0, 6).map(([k, v]) => `${k}=${v}`).join(' · ');
                push(`PARAMETERIZED LOAD: ${requestedNumericParams.length} numeric/query value${requestedNumericParams.length === 1 ? '' : 's'} requested${preview ? ' · ' + preview : ''}`);
            }
            window.__boot.status('initializing renderer + spawn chunk…' + (requestedNumericParams.length ? ` · ${requestedNumericParams.length} parameter value(s) in URL` : ''));
        })();
    </script>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js"
        }
    }
    </script>
    <script type="module" src="./main.js" onerror="window.__boot?.fail('main.js failed to load as a module -- check the network tab for a 404/CORS/MIME-type error on main.js or one of its imports')"></script>
</body>

</html>
