<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="color-scheme" content="dark">
  <title>Concrete Jungle / Performance Test</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070a;color:#dbe7ef;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{touch-action:none}canvas{display:block;width:100%;height:100%;outline:0}.hud{position:fixed;inset:0;pointer-events:none}.status{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:7px 9px;border:1px solid #22303a;background:#071016cc;backdrop-filter:blur(4px);white-space:pre;opacity:.82}.enter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border:1px solid #42515c;background:#071016e8;text-align:center;letter-spacing:.08em}.enter small{display:block;margin-top:5px;opacity:.64;letter-spacing:0}.crosshair{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);opacity:0}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#dbe7efaa}.crosshair:before{left:4px;top:0;width:1px;height:10px}.crosshair:after{left:0;top:4px;width:10px;height:1px}body.locked .enter{display:none}body.locked .crosshair{opacity:.72}.fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#05070a;color:#f2c8c8;font:14px/1.5 ui-monospace,monospace;text-align:center}
  </style>
</head>
<body>
  <canvas id="view" aria-label="3D city performance test"></canvas>
  <div class="hud" aria-hidden="true">
    <div class="status" id="status">BOOT</div>
    <div class="enter">CLICK TO ENTER<small>WASD · MOUSE · SHIFT</small></div>
    <div class="crosshair"></div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
