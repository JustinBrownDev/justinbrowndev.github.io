<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Testing — Walkaround</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05040a;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: radial-gradient(ellipse at center, #150a24 0%, #05040a 80%);
            color: #f4e9ff;
            text-align: center;
            z-index: 20;
            padding: 2rem;
        }
        #overlay h1 {
            margin: 0;
            font-size: clamp(1.5rem, 6vw, 2.75rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ff2fd6;
            text-shadow: 0 0 8px #ff2fd6, 0 0 24px #ff2fd6aa;
        }
        #overlay p {
            max-width: 32rem;
            line-height: 1.5;
            color: #b9a8d9;
            font-size: 0.95rem;
        }
        #enterBtn {
            padding: 0.9rem 2.2rem;
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: transparent;
            border: 2px solid #2fe8ff;
            color: #2fe8ff;
            cursor: pointer;
            box-shadow: 0 0 10px #2fe8ff88, inset 0 0 10px #2fe8ff33;
            transition: background 0.2s, color 0.2s;
        }
        #enterBtn:hover { background: #2fe8ff; color: #05040a; }

        #backLink {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 30;
            color: #b9a8d9;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid #b9a8d955;
            padding: 6px 10px;
            background: #05040acc;
        }
        #backLink:hover { color: #2fe8ff; border-color: #2fe8ff; }

        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffffffaa;
            z-index: 15;
            display: none;
            pointer-events: none;
        }

        /* touch controls */
        #joystickZone, #lookZone {
            position: fixed;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 10;
            touch-action: none;
            display: none;
        }
        #joystickZone { left: 0; }
        #lookZone { right: 0; }

        #joystickBase {
            position: fixed;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid #2fe8ff66;
            background: #2fe8ff11;
            display: none;
            z-index: 11;
            pointer-events: none;
        }
        #joystickKnob {
            position: fixed;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #2fe8ff55;
            border: 1px solid #2fe8ff;
            display: none;
            z-index: 12;
            pointer-events: none;
        }

        #touchHint {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #b9a8d999;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            z-index: 13;
            display: none;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <a id="backLink" href="../index.html">&larr; back to site</a>

    <div id="overlay">
        <h1>The Plaza</h1>
        <p>
            An avant-garde Times Square, built from the bones of this portfolio.
            Every billboard is a page. Walk through it.
        </p>
        <button id="enterBtn">Enter</button>
        <p id="controlsHint" style="font-size:0.75rem; color:#7a6a99;"></p>
    </div>

    <div id="crosshair"></div>
    <div id="joystickZone"></div>
    <div id="lookZone"></div>
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
    <div id="touchHint">left: move · right: drag to look</div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js"
        }
    }
    </script>
    <script type="module" src="./main.js"></script>
</body>

</html>
