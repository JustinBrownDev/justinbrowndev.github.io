<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Testing — Back Alley</title>
    <meta name="description" content="A cramped neon back-alley maze, walkable in 3D.">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0305;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }

        #backLink {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 30;
            color: #d99;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid #d9999955;
            padding: 6px 10px;
            background: #0a0305cc;
        }
        #backLink:hover { color: #ff2f4f; border-color: #ff2f4f; }

        #hint {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: #e8c9c9cc;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            z-index: 25;
            pointer-events: none;
            text-shadow: 0 0 6px #000, 0 0 2px #000;
            transition: opacity 0.4s;
        }

        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffffffaa;
            z-index: 15;
            display: none;
            pointer-events: none;
        }

        /* touch controls */
        #joystickZone, #lookZone {
            position: fixed;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 10;
            touch-action: none;
            display: none;
        }
        #joystickZone { left: 0; }
        #lookZone { right: 0; }

        #joystickBase {
            position: fixed;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid #ff2f6a66;
            background: #ff2f6a11;
            display: none;
            z-index: 11;
            pointer-events: none;
        }
        #joystickKnob {
            position: fixed;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #ff2f6a55;
            border: 1px solid #ff2f6a;
            display: none;
            z-index: 12;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <a id="backLink" href="../index.html">&larr; back to site</a>

    <div id="crosshair"></div>
    <div id="hint"></div>
    <div id="joystickZone"></div>
    <div id="lookZone"></div>
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js"
        }
    }
    </script>
    <script type="module" src="./main.js"></script>
</body>

</html>
